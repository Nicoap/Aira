name: Sign test

# Временный workflow: проверка подписи MSI в SignPath без публикации релиза.
# Запускается только вручную (Actions → Sign test → Run workflow).
# Собирает тот же MSI, что и release.yml, отправляет его в SignPath и
# выкладывает подписанный файл артефактом. Удаляется после проверки.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: VLC natives (Windows x64)
        shell: pwsh
        run: ./gradlew.bat :composeApp:vlcSetupWindowsX64Ci --no-configuration-cache

      - name: Собрать MSI
        shell: pwsh
        run: ./gradlew.bat :desktopApp:packageMsi --no-configuration-cache --console=plain

      - name: Подготовить MSI к подписи
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-msi | Out-Null
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI не найден' }
          Copy-Item $msi.FullName 'unsigned-msi\'
          Write-Host "к подписи: $($msi.Name) ($([math]::Round($msi.Length / 1MB)) МБ)"

      - name: Загрузить неподписанный MSI
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: aira-msi-unsigned
          path: unsigned-msi/*.msi
          archive: false
          if-no-files-found: error

      - name: Подписать MSI в SignPath
        id: sign-msi
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: aira
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi-deep
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msi
          skip-decompress: true

      - name: Проверить подпись
        shell: pwsh
        run: |
          $signed = Get-ChildItem 'signed-msi' -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { throw 'Подписанный MSI не найден в signed-msi' }
          Write-Host "подписанный MSI: $($signed.Name) ($([math]::Round($signed.Length / 1MB)) МБ)"
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "статус подписи: $($sig.Status)"
          Write-Host "подписант: $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-msi-test
          path: signed-msi/**/*.msi
          if-no-files-found: error
