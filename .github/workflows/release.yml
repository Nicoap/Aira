name: Release

# =============================================================================
# Aira — release (Android APK + Windows MSI)
# =============================================================================
#
# Триггеры:
#   - push тега "v*.*.*"  → настоящий релиз, публикуется в GitHub Releases
#   - workflow_dispatch   → прогон пайплайна без тега (берёт version-name)
#
# Что собирается:
#   android → подписанные release-APK (keystore из секретов репозитория)
#   desktop → Windows MSI через jpackage (тот же путь, что и локально:
#             gradlew :desktopApp:packageMsi)
#   publish → один GitHub Release со всеми ассетами
#
# Conveyor в CI больше не используется: это сторонний коммерческий продукт,
# он требовал отдельную лицензию и signing key. MSI от jpackage ставится
# обычным кликом и не требует ни сертификата, ни аккаунта.
#
# Секреты репозитория:
#   WAVORA_KEYSTORE_BASE64            — release-keystore в base64
#   WAVORA_RELEASE_KEYSTORE_PASSWORD  — пароль хранилища
#   WAVORA_RELEASE_KEY_ALIAS          — алиас ключа
#   WAVORA_RELEASE_KEY_PASSWORD       — пароль ключа
#   SENTRY_DSN, SENTRY_AUTH_TOKEN     — необязательные
# =============================================================================

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для релиза (пример: v1.0.0). Пусто — версия из gradle/libs.versions.toml с префиксом v."
        required: false
        type: string

permissions:
  contents: write
  # нужно для чтения артефакта сборки при отправке в SignPath
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Определяет тег и версию один раз и отдаёт их остальным задачам.
  # ---------------------------------------------------------------------------
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Резолв тега и версии
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP '(?<=version-name = ")[^"]+' gradle/libs.versions.toml | tr -d '\r')

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${VERSION_NAME}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG_VERSION="${TAG#v}"
          # Тег может нести суффикс сборки (например v1.0.0-aira), а version-name
          # в libs.versions.toml — только числовую часть, поэтому сравниваем базу.
          BASE_TAG_VERSION="${TAG_VERSION%%-*}"
          BASE_VERSION_NAME="${VERSION_NAME%%-*}"
          if [ "$BASE_TAG_VERSION" != "$BASE_VERSION_NAME" ]; then
            echo "::error::Тег ($TAG) не совпадает с version-name в gradle/libs.versions.toml ($VERSION_NAME)."
            echo "::error::Обнови libs.versions.toml и перетегируй, либо запусти workflow_dispatch без 'tag', чтобы взять версию из репозитория."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Релиз: $TAG (version-name=$VERSION_NAME)"

  # ---------------------------------------------------------------------------
  # Android — тот же signingConfig, что уже есть в androidApp/build.gradle.kts,
  # только пароли приходят из секретов, а не из локальных переменных окружения.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Установить platform/build-tools API 37
        # compileSdk проекта — 37 (см. androidApp/build.gradle.kts): зависимости,
        # зафиксированные в libs.versions.toml (material3-expressive 1.5.0-alpha21,
        # core-ktx 1.19.0, foundation/animation/ui 1.12.0-alpha03), требуют именно
        # его, поэтому шаг обязательный: без платформы сборка должна упасть здесь,
        # а не на checkReleaseAarMetadata с 14 непонятными ошибками.
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -path "*/bin/*" | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager не найден в $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          # Google теперь публикует API 37 с минорной версией: в индексе лежат
          # platforms;android-37.0 / -37.1 / -37.2, а пакета 'platforms;android-37'
          # не существует (из-за него прошлый запуск падал). Ставим 37.0 — это база
          # API 37, которую ищет AGP при compileSdk = 37.
          echo "Устанавливаю platforms;android-37.0 build-tools;37.0.0..."
          # Не используем `if ! yes | sdkmanager ...`: pipefail превращает SIGPIPE
          # от `yes` в ошибку и маскирует реальный код возврата sdkmanager.
          set +e
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0"
          SDKMANAGER_37_EXIT=${PIPESTATUS[1]}
          set -e
          if [ "$SDKMANAGER_37_EXIT" -ne 0 ]; then
            echo "::error::Не удалось установить 'platforms;android-37.0' или 'build-tools;37.0.0'."
            exit 1
          fi

          # AGP с compileSdk = 37 ищет каталог platforms/android-37, а sdkmanager
          # распаковывает минорную платформу в platforms/android-37.0. Делаем
          # символическую ссылку, иначе сборка падает на отсутствии платформы.
          if [ ! -d "$SDK_ROOT/platforms/android-37" ] && [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
          ls -1 "$SDK_ROOT/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Раскодировать keystore
        shell: bash
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/aira-release.jks"
          echo "${{ secrets.WAVORA_KEYSTORE_BASE64 }}" | base64 -d > "$KS_PATH"
          # Ранняя проверка: если секрет загружен неверно, падаем здесь с
          # понятным сообщением, а не с криптическим стектрейсом Gradle.
          keytool -list -keystore "$KS_PATH" \
            -storepass "${{ secrets.WAVORA_RELEASE_KEYSTORE_PASSWORD }}" > /dev/null
          echo "WAVORA_RELEASE_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Собрать release-APK
        env:
          WAVORA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.WAVORA_RELEASE_KEYSTORE_PASSWORD }}
          WAVORA_RELEASE_KEY_ALIAS: ${{ secrets.WAVORA_RELEASE_KEY_ALIAS }}
          WAVORA_RELEASE_KEY_PASSWORD: ${{ secrets.WAVORA_RELEASE_KEY_PASSWORD }}
          # Sentry опционален: без этих секретов сборка проходит, просто без
          # crash-репортинга.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          FULL_BUILD=true
          # --stacktrace: упаковка APK иногда падает внутри
          # IncrementalSplitterRunnable без единой строки причины, и без
          # стектрейса в логе нечего читать.
          ./gradlew androidApp:assembleRelease --no-configuration-cache \
            -PisFullBuild=$FULL_BUILD --stacktrace

      - name: Проверить подписи и переименовать APK
        shell: bash
        run: |
          set -euo pipefail
          # У проекта есть флейворы (mobile/tv), поэтому APK лежат не в apk/release,
          # а глубже: apk/<flavor>/release/... — ищем по всему дереву вывода.
          SRC="androidApp/build/outputs/apk"
          OUT="release-apks"
          mkdir -p "$OUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Не найден каталог build-tools в $ANDROID_HOME"
            exit 1
          fi
          echo "build-tools: $BUILD_TOOLS"
          echo "--- Собранные APK ---"
          find "$SRC" -name "*.apk" -print || true

          declare -A NAME_MAP=(
            ["arm64-v8a"]="Aira-arm64.apk"
            ["armeabi-v7a"]="Aira-armeabi-v7a.apk"
            ["x86_64"]="Aira-x86_64.apk"
            ["universal"]="Aira-universal.apk"
          )

          FOUND=0
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk=$(find "$SRC" -iname "*${abi}*release*.apk" ! -iname "*unsigned*" | sort | head -n1)
            if [ -z "$apk" ]; then
              echo "::warning::APK для $abi не найден, пропускаю."
              continue
            fi
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
            cp "$apk" "$OUT/${NAME_MAP[$abi]}"
            echo "OK: ${NAME_MAP[$abi]}"
            FOUND=$((FOUND + 1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::Не найдено ни одного собранного APK — проверьте имена выходных файлов."
            exit 1
          fi

          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop — Windows MSI через jpackage (gradlew :desktopApp:packageMsi).
  # Никакого Conveyor: без лицензий, signing key и MSIX-инфраструктуры.
  # ---------------------------------------------------------------------------
  desktop:
    runs-on: windows-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: VLC natives (Windows x64)
        shell: pwsh
        run: ./gradlew.bat :composeApp:vlcSetupWindowsX64Ci --no-configuration-cache

      - name: Собрать MSI
        shell: pwsh
        run: ./gradlew.bat :desktopApp:packageMsi --no-configuration-cache --console=plain

      - name: Список собранных установщиков
        shell: pwsh
        run: Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Format-Table Name,Length

      # Подпись кода через SignPath (бесплатно для open-source проектов).
      # Пока секретов нет — шаги подписи просто пропускаются, и в релиз уходит
      # неподписанный MSI: пайплайн не ломается до одобрения заявки.
      - name: Подготовить MSI к подписи
        id: prepare-msi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-msi | Out-Null
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI не найден' }
          Copy-Item $msi.FullName 'unsigned-msi\'
          Write-Host "к подписи: $($msi.Name) ($([math]::Round($msi.Length / 1MB)) МБ)"

      - name: Загрузить неподписанный MSI
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: aira-msi-unsigned
          path: unsigned-msi/*.msi
          archive: false
          if-no-files-found: error

      # Включается переменной репозитория SIGNPATH_ENABLED=true — это делается
      # после одобрения заявки в SignPath Foundation, когда в организации
      # появится trusted build system GitHub.com. Пока переменной нет, шаг
      # пропускается и в релиз уходит неподписанный MSI (пайплайн не падает).
      - name: Подписать MSI в SignPath
        id: sign-msi
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: aira
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi-deep
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msi
          skip-decompress: true

      - name: Выбрать MSI для релиза
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-msi | Out-Null
          $signed = Get-ChildItem 'signed-msi' -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signed) {
            Copy-Item $signed.FullName 'release-msi\'
            $sig = Get-AuthenticodeSignature $signed.FullName
            Write-Host "подписанный MSI: $($signed.Name), статус подписи: $($sig.Status), подписант: $($sig.SignerCertificate.Subject)"
          } else {
            $raw = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi/*.msi' | Select-Object -First 1
            Copy-Item $raw.FullName 'release-msi\'
            Write-Host "ВНИМАНИЕ: секреты SignPath не заданы, релиз получит неподписанный $($raw.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: release-msi/*.msi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — DMG через jpackage. macos-14 — это arm64-раннер, поэтому берём
  # VLC-срез под arm64 (`vlcSetupMacArmCi`).
  # ---------------------------------------------------------------------------
  desktop-macos:
    runs-on: macos-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: VLC natives (macOS arm64)
        run: ./gradlew :composeApp:vlcSetupMacArmCi --no-configuration-cache

      - name: Собрать DMG
        run: ./gradlew :desktopApp:packageDmg --no-configuration-cache --console=plain

      # jpackage кладёт DMG в каталог, имя которого зависит от версии плагина,
      # поэтому ищем по маске, а не по жёсткому пути.
      # Копируем DMG в корень workspace: artifact с glob-путём распаковывается
      # с сохранением структуры каталогов, и publish перестаёт видеть файл.
      - name: Собрать DMG в корень
        run: |
          set -euo pipefail
          while IFS= read -r dmg; do cp -v "$dmg" .; done < <(find desktopApp/build/compose/binaries -name '*.dmg')
          ls -lh ./*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: ./*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — AppImage через jpackage. fakeroot нужен самому jpackage.
  # ---------------------------------------------------------------------------
  desktop-linux:
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Зависимости AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: VLC natives (Linux x64)
        run: ./gradlew :composeApp:vlcSetupLinuxCi --no-configuration-cache

      - name: Собрать Linux-дистрибутив
        run: ./gradlew :desktopApp:packageAppImage --no-configuration-cache --console=plain

      # jpackage на Linux выдаёт распакованный образ приложения в
      # desktopApp/build/compose/binaries/main/app — однофайловый .AppImage он
      # не собирает, поэтому упаковываем каталог в переносимый tar.gz.
      - name: Упаковать в tar.gz
        run: |
          set -euo pipefail
          APP_DIR="desktopApp/build/compose/binaries/main/app"
          test -d "$APP_DIR" || { echo "::error::нет каталога $APP_DIR"; exit 1; }
          ls -lh "$APP_DIR"
          tar -czf "Aira-${{ needs.resolve-version.outputs.version }}-linux-x64.tar.gz" -C "$APP_DIR" .
          ls -lh Aira-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: Aira-*-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish — один GitHub Release со всеми ассетами (APK + MSI + DMG + AppImage).
  # non-draft, non-prerelease: сразу становится "latest", чтобы автообновление
  # и ссылки releases/latest/download/... работали.
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [resolve-version, android, desktop, desktop-macos, desktop-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets/android

      - uses: actions/download-artifact@v4
        with:
          name: desktop-msi
          path: release-assets/desktop

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dmg
          path: release-assets/macos

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release-assets/linux

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Aira ${{ needs.resolve-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## Aira ${{ needs.resolve-version.outputs.version }}

            **Windows:** скачай `Aira-${{ needs.resolve-version.outputs.version }}.msi` и запусти — обычный установщик, ставится без сертификатов и без прав администратора сверх обычного.

            **macOS:** скачай `.dmg` (сборка под Apple Silicon). Сборка не подписана сертификатом Apple, поэтому при первом запуске: правый клик по приложению → «Открыть», либо `xattr -dr com.apple.quarantine /Applications/Aira.app`.

            **Linux:** скачай `.tar.gz`, распакуй (`tar -xzf Aira-*-linux-x64.tar.gz`) и запусти `bin/Aira` из полученного каталога.

            **Android:** скачай APK под своё устройство; если не уверен — `Aira-universal.apk`.

            ---

            Изменения — в истории коммитов: https://github.com/Nicoap/Aira/commits/main
          files: |
            release-assets/android/*.apk
            release-assets/desktop/*.msi
            release-assets/macos/*.dmg
            release-assets/linux/*.tar.gz

  # ---------------------------------------------------------------------------
  # Verify — после публикации проверяем через API, что все ассеты релиза
  # реально загружены и названы так, как их ждёт документация релиза.
  #
  # WHY не через releases/download/...: репозиторий ПРИВАТНЫЙ, и GitHub на
  # анонимный запрос к такой ссылке отвечает 404 (прячет существование), даже
  # когда ассет на месте. Из-за этого прошлый прогон падал на живой сборке.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    needs: [publish, resolve-version]
    steps:
      - name: Проверить ассеты опубликованного релиза
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Nicoap/Aira/releases/tags/$TAG"
          JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API")

          echo "--- Ассеты релиза $TAG ---"
          echo "$JSON" | jq -r '.assets[] | "  \(.name)  \(.size) байт  \(.state)"'

          for asset in \
            "Aira-${VERSION}.msi" \
            "Aira-arm64.apk" \
            "Aira-armeabi-v7a.apk" \
            "Aira-x86_64.apk" \
            "Aira-universal.apk"; do
            STATE=$(echo "$JSON" | jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .state')
            SIZE=$(echo "$JSON" | jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .size')
            if [ "$STATE" != "uploaded" ] || [ -z "$SIZE" ] || [ "$SIZE" -lt 1000000 ]; then
              echo "::error::Ассет $asset отсутствует или не загружен (state=${STATE:-none}, size=${SIZE:-0})."
              exit 1
            fi
            echo "OK: $asset ($SIZE байт)"
          done

          # macOS/Linux: точное имя генерирует jpackage, поэтому проверяем по
          # расширению, а не по шаблону Aira-<version>.
          for suffix in ".dmg" ".tar.gz"; do
            ASSET=$(echo "$JSON" | jq -r --arg s "$suffix" \
              '[.assets[] | select(.name | endswith($s))][0].name // empty')
            SIZE=$(echo "$JSON" | jq -r --arg s "$suffix" \
              '[.assets[] | select(.name | endswith($s))][0].size // 0')
            if [ -z "$ASSET" ] || [ "$SIZE" -lt 1000000 ]; then
              echo "::error::Не найден ассет с расширением $suffix (size=${SIZE:-0})."
              exit 1
            fi
            echo "OK: $ASSET ($SIZE байт)"
          done

          echo "Все ассеты релиза на месте."
